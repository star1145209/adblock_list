# 参考 `application-example.yaml` 并在处添加订阅规则，请注意缩进
# Refer to `application-example.yaml` and add subscription rules there，please note the indentation

adfs:

  input:

    - name: AdGuard 基础过滤器
      path: https://filters.adtidy.org/extension/chromium/filters/2_optimized.txt
      type: adblock
      dialect: adguard
  
    - name: AdGuard 移动广告过滤器
      path: https://filters.adtidy.org/extension/chromium/filters/11_optimized.txt
      type: adblock
      dialect: adguard

    - name: AWAvenue-Adblock-Rule
      path: https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/AWAvenue-Ads-Rule.txt
      type: adblock
      dialect: adguard

    - name: NoAppDownload
      path: https://raw.githubusercontent.com/Noyllopa/NoAppDownload/master/NoAppDownload.txt
      type: adblock
      dialect: adguard

    - name: xinggsf movie
      path: https://raw.githubusercontent.com/xinggsf/Adblock-Plus-Rule/master/mv.txt
      type: adblock
      dialect: adguard

    - name: cjxlist annoyance
      path: https://raw.githubusercontent.com/cjx82630/cjxlist/master/cjx-annoyance.txt
      type: adblock
      dialect: adguard

    - name: EasyList China+EasyList
      path: https://easylist-downloads.adblockplus.org/easylistchina+easylist.txt
      type: adblock
      dialect: abp

    - name: 'private adblock list'
      path: 'rule/private.txt'
      type: adblock
      dialect: adguard

  output:
    - name: easylist.txt
      type: adblock
      dialect: adguard

    - name: ubo.txt
      type: adblock
      dialect: ubo

    - name: abp.txt
      type: adblock
      dialect: abp

    - name: dns.txt
      type: dns
      dialect: adguard

    - name: hosts.txt
      type: hosts

    - name: dnsmasq.txt
      type: dnsmasq

    - name: smartdns.txt
      type: smartdns

    - name: clash.yaml
      type: mihomo
      dialect: domain
      container: yaml

    - name: sing-box.json
      type: sing-box
      container: json


  config:
    file_header: |
      Title: xndeye adblock list of {{dialect}}
      Total Size: {{total}}
      Last Modified: {{date}}
      Homepage: https://github.com/xndeye/adblock_list
      Powered by: https://github.com/fordes123/ad-filters-subscriber


    rules:
      min-length: 1
      max-length: 65536  # 存在文本输入时，不得超过 input.max-line-length。
      whitelist:
        # 华为应用商店相关域名
        - "store-drcn.hispace.dbankcloud.com"
        # 屏蔽此域名会导致小米部分服务异常
        - "api.comm.miui.com"
        # 屏蔽此域会导致Edge浏览器翻译不可用
        - "edge.microsoft.com"
        # 屏蔽此域会导致小米天气网络异常
        - "metok.sys.miui.com"
        # 屏蔽此域会导致小米云备份网络异常
        - "a0.app.xiaomi.com"
        # 屏蔽此域会导致10086 App登陆异常
        - "client.app.coc.10086.cn"
        # 屏蔽此域会导致MSN页面无法正常加载
        - "assets.msn.com"
        # 预防华为域名误杀
        - "huawei.com"
        # 屏蔽此域名会导致云闪付横幅异常
        - "ads.cup.com.cn"

    conversion:
      allow-expansion: false
      allow-reduction: true

    dns:
      enabled: false
      strict-mode: false
      servers:
        - 8.8.8.8:53
        - 8.8.4.4:53
        - 1.1.1.1:53
        - 1.0.0.1:53
        - 9.9.9.9:53
      concurrency: 128
      timeout: 3s
      retries: 1
      max-cname-depth: 16
      cache:
        max-entries: 50000
        max-ttl: 2m
        max-negative-ttl: 1m
