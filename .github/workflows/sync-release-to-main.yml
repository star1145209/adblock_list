name: Sync Release to Main

on:
  schedule:
    # 每隔6小时运行一次（UTC时间）
    - cron: '0 */6 * * *'
  workflow_dispatch: # 允许手动触发

# 关键：授予写入权限
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Main Branch
        uses: actions/checkout@v7
        with:
          ref: main
          path: main
          fetch-depth: 0

      - name: Checkout Release Branch
        uses: actions/checkout@v7
        with:
          ref: release
          path: release
          fetch-depth: 0

      - name: Sync release to main/rule (mirror, delete stale files)
        run: |
          mkdir -p main/rule
          # rsync 镜像同步，--delete 删除目标多余文件
          rsync -av --delete release/ main/rule/

      - name: Commit and Push Changes
        run: |
          cd main
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          # 只有存在变更才提交
          if git diff --staged --quiet; then
            echo "✅ No changes to sync, skip commit & push"
          else
            git commit -m "chore: sync release branch to main/rule [automated]"
            git push
          fi
