name: Sync Release to Main

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main branch into ./main
        uses: actions/checkout@v4          # 修复：v7 → v4
        with:
          ref: main
          path: main
          fetch-depth: 0

      - name: Checkout release branch into ./release
        uses: actions/checkout@v4          # 修复：v7 → v4
        with:
          ref: release
          path: release
          fetch-depth: 0

      - name: Sync release → main/rule（保留原有文件）
        run: |
          mkdir -p main/rule
          rsync -av --exclude='.git' release/ main/rule/
        # -a：归档模式（递归 + 保留权限/时间戳）
        # -v：显示详细输出
        # --exclude='.git'：排除 .git 目录，避免破坏 main 的 Git 仓库
        # 没有 --delete → 目标目录中已有的、release 中不存在的文件会保留

      - name: Commit & Push
        run: |
          cd main
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add rule/
          if git diff --staged --quiet; then
            echo "没有变更，跳过提交"
          else
            git commit -m "chore: sync release branch to main/rule [automated, no clean]"
            git push
          fi
