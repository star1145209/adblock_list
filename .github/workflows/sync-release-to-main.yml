name: Sync Release to Main

on:
  schedule:
    # UTC 时间每6小时执行一次
    - cron: '0 */6 * * *'
  workflow_dispatch: # 支持手动触发

# 授予推送权限
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Main Branch
        uses: actions/checkout@v7
        with:
          ref: main
          path: main
          fetch-depth: 0

      - name: Checkout Release Branch
        uses: actions/checkout@v7
        with:
          ref: release
          path: release
          fetch-depth: 0

      - name: Sync release → main/rule（不删除目标原有文件）
        run: |
          mkdir -p main/rule
          # 重点：没有 --delete
          # 同名文件会被release覆盖；main/rule独有的文件全部保留
          rsync -av release/ main/rule/

      - name: Commit & Push
        run: |
          cd main
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          # 没有变更就跳过提交，避免报错
          if git diff --staged --quiet; then
            echo "无文件变更，跳过提交推送"
          else
            git commit -m "chore: sync release branch to main/rule [automated, no clean]"
            git push
          fi
