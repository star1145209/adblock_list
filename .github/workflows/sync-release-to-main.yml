name: Sync Release to Main

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout main branch into ./main
        uses: actions/checkout@v6
        with:
          ref: main
          path: main
          fetch-depth: 0

      - name: Checkout release branch into ./release
        uses: actions/checkout@v6
        with:
          ref: release
          path: release
          fetch-depth: 0

      - name: Sync release → main/rule（保留原有文件）
        run: |
          mkdir -p main/rule
          rsync -av --exclude='.git' release/ main/rule/

      - name: Commit & Push
        run: |
          cd main
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # main 分支的 .gitignore 忽略了 rule 目录，需要用 -f 强制添加
          git add -f rule/
          if git diff --staged --quiet; then
            echo "没有变更，跳过提交"
          else
            git commit -m "chore: sync release branch to main/rule [automated, no clean]"
            git push
          fi
