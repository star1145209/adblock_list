name: Sync Release to Main

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write  # 必须保留：允许工作流向仓库写入内容

jobs:
  sync:
    runs-on: ubuntu-24.04  # 锁定版本，避免 ubuntu-latest 标签迁移带来的潜在问题
    timeout-minutes: 30
    steps:
      - name: Checkout main branch into ./main
        uses: actions/checkout@v6  # 升级到 v6，以消除 Node.js 20 弃用警告
        with:
          ref: main
          path: main
          fetch-depth: 0

      - name: Checkout release branch into ./release
        uses: actions/checkout@v6  # 升级到 v6，以消除 Node.js 20 弃用警告
        with:
          ref: release
          path: release
          fetch-depth: 0

      - name: Sync release → main/rule（保留原有文件）
        run: |
          mkdir -p main/rule
          rsync -av --exclude='.git' release/ main/rule/

      - name: Commit & Push
        run: |
          cd main
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add rule/
          if git diff --staged --quiet; then
            echo "没有变更，跳过提交"
          else
            git commit -m "chore: sync release branch to main/rule [automated, no clean]"
            git push
          fi
